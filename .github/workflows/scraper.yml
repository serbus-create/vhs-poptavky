name: VHS. Mezinárodní hlídač poptávek

on:
  schedule:
    - cron: "0 7,9,11,13,15,17,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Spuštění scraperu
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python scraper.py
      - name: Uložení paměti
        run: |
          git config user.name "vhs-scraper-bot"
          git config user.email "bot@v-h-s.cz"
          git add seen_ids.json || true
          git diff --staged --quiet || git commit -m "update seen_ids [skip ci]"
          git push
