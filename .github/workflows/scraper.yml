name: VHS. Poptávkový hlídač

on:
  schedule:
    - cron: "0 7,9,11,13,15,17,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalace závislostí
        run: npm install

      - name: Instalace Chromia pro Playwright
        run: npx playwright install --with-deps chromium

      - name: Spuštění scraperu
        run: node scraper.js

      - name: Uložení dat (leads.json + seen_ids.json)
        run: |
          git config user.name "vhs-scraper-bot"
          git config user.email "bot@v-h-s.cz"
          git add leads.json seen_ids.json || true
          git diff --staged --quiet || git commit -m "update poptávky [skip ci]"
          git push
